<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SmartBath</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">SmartBath</div>
</header>

<!-- HOME TAB -->
<div class="tab-content active" id="tab-home">
  <div class="home">

    <!-- STATUS  -->
    <div class="status-menu">
      <div class="status-card">
        <div class="status-dot" id="dot-app"></div>
        <div class="status-info">
          <div class="status-title">App</div>
          <div class="status-val" id="val-app">Disconnected</div>
        </div>
      </div>
      <div class="status-card">
        <div class="status-dot" id="dot-bath"></div>
        <div class="status-info">
          <div class="status-title">Bath</div>
          <div class="status-val" id="val-bath">Idle</div>
        </div>
      </div>
    </div>

    <!-- TEMPERATURE -->
    <div class="temp-card">
      <div class="card-title">Target Temperature</div>
      <div class="temp-row">
        <div>
          <div class="temp-display">
            <div class="temp-value" id="temp-target-display">38</div>
            <div class="temp-unit">°C</div>
          </div>
          <div class="temp-target-title">Target: <b id="target-confirm">38°C</b></div>
        </div>
        <div class="temp-controls">
          <button class="temp-btn" id="btn-up">+</button>
          <button class="temp-btn" id="btn-down">–</button>
        </div>
      </div>
      <div class="current-temp-row">
        <div class="current-temp-title">Current Water Temperature</div>
        <div class="current-temp-val" id="current-temp">–</div>
      </div>
    </div>

    <!-- PROGRESS  -->
    <div class="progress-card">
      <div class="progress-wrap">
        <div class="card-title">Fill Progress</div>
        <div class="progress-percent" id="progress-percent">0%</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- START BUTTON -->
    <div class="start-wrap">
      <button class="start-btn idle" id="start-btn">Start Bath</button>
    </div>

  </div>
</div>

<!-- NOTIFICATIONS TAB -->
<div class="tab-content" id="tab-notif">
  <div class="notif-body">
    <div class="notif-header">
      <div class="notif-title">Notifications</div>
      <button class="clear-btn" id="clear-btn">Clear all</button>
    </div>
    <div id="notif-list">
      <div class="notif-empty" id="notif-empty">
        <img class="nav-icon" src="./assets/bell.svg" alt="Notifications"><br>
        No notifications
      </div>
    </div>
  </div>
</div>

<!-- NAVIGATION -->
<nav>
  <button class="nav-btn active" data-tab="home" onclick="switchTab('home', this)">
    <img class="nav-icon" src="./assets/home.svg" alt="Home">
    Home
  </button>
  <button class="nav-btn" data-tab="notif" onclick="switchTab('notif', this)">
    <img class="nav-icon" src="./assets/bell.svg" alt="Notifications">
    <span class="nav-new" id="notif-new"></span>
    Notifications
  </button>
</nav>

<script src="app.js"></script>
<script src="mqtt.js"></script>
</body>
</html>
